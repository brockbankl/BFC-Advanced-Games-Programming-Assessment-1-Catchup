name: Build and dependency audit

on:
  push:
    branches: [main, shader, particle-effect, post-process, rising-water]
  pull_request:
    branches: [main, shader, particle-effect, post-process, rising-water]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windowsdx:
    name: WindowsDX build
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - name: Restore content builder and game
        shell: pwsh
        run: |
          dotnet restore ./Content/Content.csproj
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet restore ./WindowsDX/Platformer3D.csproj
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build game and content
        run: dotnet build ./WindowsDX/Platformer3D.csproj --no-restore
      - name: Check private-copy script and Netlab fallback
        shell: pwsh
        run: ./scripts/tests/Test-PrivateAssessment1.ps1
      - name: Check known dependency vulnerabilities
        shell: pwsh
        run: |
          foreach ($project in @('./Content/Content.csproj', './WindowsDX/Platformer3D.csproj')) {
            $output = dotnet list $project package --vulnerable --include-transitive --format json
            if ($LASTEXITCODE -ne 0) { throw "Dependency audit failed: $project" }
            $audit = ($output -join "`n") | ConvertFrom-Json
            foreach ($item in $audit.projects) {
              foreach ($framework in $item.frameworks) {
                foreach ($package in (@($framework.topLevelPackages) + @($framework.transitivePackages))) {
                  if ($package.vulnerabilities.Count -gt 0) {
                    throw "Vulnerable dependency: $($package.id) $($package.resolvedVersion)"
                  }
                }
              }
            }
          }
